name: Tests

on:
  push:
    paths: ["converter/**", "tests/**", ".github/workflows/tests.yml"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
      - run: pip install -r converter/requirements.txt pytest
      - run: pytest -q
